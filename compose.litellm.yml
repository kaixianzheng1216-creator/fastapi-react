services:
  litellm:
    image: docker.litellm.ai/berriai/litellm-database:v1.94.0
    restart: always
    command: --config /app/config.yaml
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY?Variable not set}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY?Variable not set}
      DATABASE_URL: postgresql://litellm:${LITELLM_POSTGRES_PASSWORD?Variable not set}@litellm-db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY?Variable not set}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY?Variable not set}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY?Variable not set}
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"]
      interval: 5s
      timeout: 5s
      start_period: 90s
      retries: 10

  litellm-db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD?Variable not set}
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - litellm-db-data:/var/lib/postgresql/data

volumes:
  litellm-db-data:
