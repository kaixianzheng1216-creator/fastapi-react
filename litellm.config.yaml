model_list:
  - model_name: deepseek-v4-pro
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: os.environ/NEWAPI_BASE_URL
      api_key: os.environ/NEWAPI_API_KEY
    model_info:
      mode: chat
      supports_vision: true
      supported_openai_params: [thinking]
  - model_name: deepseek-flash
    litellm_params:
      model: openai/deepseek-flash
      api_base: os.environ/NEWAPI_BASE_URL
      api_key: os.environ/NEWAPI_API_KEY
    model_info:
      mode: chat
      supports_vision: true
      supported_openai_params: [thinking]

mcp_servers:
  firecrawl:
    url: https://mcp.firecrawl.dev/v2/mcp
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/FIRECRAWL_API_KEY
