model_list:
  - model_name: deepseek/deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_base: os.environ/NEWAPI_BASE_URL
      api_key: os.environ/NEWAPI_API_KEY
    model_info:
      mode: chat
  - model_name: deepseek/deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_base: os.environ/NEWAPI_BASE_URL
      api_key: os.environ/NEWAPI_API_KEY
    model_info:
      mode: chat
  - model_name: deepseek/deepseek-v4-flash-vision-exp
    litellm_params:
      model: openai/deepseek-v4-flash-vision-exp
      api_base: os.environ/NEWAPI_BASE_URL
      api_key: os.environ/NEWAPI_API_KEY
      extra_body:
        thinking:
          type: disabled
    model_info:
      mode: chat
      supports_vision: true
  - model_name: "@cf/baai/bge-m3"
    litellm_params:
      model: openai/@cf/baai/bge-m3
      api_base: os.environ/CLOUDFLARE_AI_BASE_URL
      api_key: os.environ/CLOUDFLARE_API_KEY
      additional_drop_params:
        - encoding_format
    model_info:
      mode: embedding

mcp_servers:
  firecrawl:
    url: https://mcp.firecrawl.dev/v2/mcp
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/FIRECRAWL_API_KEY
