services:
  redis:
    restart: "no"
    ports:
      - "6379:6379"

  db:
    restart: "no"
    ports:
      - "5432:5432"

  docling:
    restart: "no"

  litellm:
    restart: "no"

  qdrant:
    restart: "no"
    ports:
      - "6333:6333"

  backend:
    restart: "no"
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --reload
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - pyproject.toml
        - path: ./backend/pyproject.toml
          action: rebuild

  agent-worker:
    restart: "no"
    develop:
      watch:
        - path: ./backend
          action: sync+restart
          target: /app/backend
          ignore:
            - pyproject.toml
        - path: ./backend/pyproject.toml
          action: rebuild

  knowledge-worker:
    restart: "no"
    develop:
      watch:
        - path: ./backend
          action: sync+restart
          target: /app/backend
          ignore:
            - pyproject.toml
        - path: ./backend/pyproject.toml
          action: rebuild

  frontend:
    restart: "no"
    build:
      target: development
    develop:
      watch:
        - path: ./frontend
          action: sync
          target: /app
          ignore:
            - package.json
            - package-lock.json
        - path: ./frontend/package.json
          action: rebuild
        - path: ./frontend/package-lock.json
          action: rebuild
