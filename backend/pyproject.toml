[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi>=0.138.1,<1.0.0",
    "uvicorn[standard]>=0.49.0,<1.0.0",
    "python-multipart<1.0.0,>=0.0.27",
    "tenacity<10.0.0,>=8.2.3",
    "pydantic>2.0",
    "alembic<2.0.0,>=1.12.1",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "sqlmodel>=0.0.39,<1.0.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "pyjwt<3.0.0,>=2.13.0",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "scalar-fastapi>=1.0.0",
    "deepagents>=0.6.10,<0.7.0",
    "langchain-deepseek>=1.0.0,<2.0.0",
    "langchain-moonshot>=0.1.0,<1.0.0",
    "langchain-mcp-adapters>=0.3.0,<1.0.0",
    "langfuse>=4,<5",
    "langgraph-checkpoint-postgres>=3,<4",
    "assistant-stream>=0.0.34,<0.1.0",
    "e2b>=2.34.0,<3.0.0",
    "langchain-e2b>=0.0.5,<0.1.0",
    "cos-python-sdk-v5>=1.9.44,<2.0.0",
    "openai>=2.46.0,<3.0.0",
    "httpx>=0.28.1,<1.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "python-frontmatter>=1.3.0,<2.0.0",
    "qdrant-client>=1.15,<1.17",
    "docling-core[chunking]>=2.50,<3",
    "celery>=5.6,<6",
    "redis>=6,<8",
    "playwright>=1.58,<2.0.0",
]

[dependency-groups]
dev = [
    "mypy<3.0.0,>=1.8.0",
    "ruff<1.0.0,>=0.2.2",
    "types-openpyxl>=3.1.5.20250919",
    "types-PyYAML>=6.0.12.20250915",
]

[tool.mypy]
strict = true
exclude = "app/modules/agent/skills"

[tool.ruff]
target-version = "py314"
extend-exclude = ["alembic/versions", "app/modules/agent/skills"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle 错误
    "W",  # pycodestyle 警告
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # 函数中存在未使用的参数
    "T201",   # 不允许使用 print 语句
]
ignore = [
    "E501",  # 行过长，由格式化工具处理
    "B008",  # 不要在参数默认值中调用函数
    "W191",  # 缩进中包含制表符
]
