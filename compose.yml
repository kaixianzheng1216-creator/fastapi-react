services:
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - app-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
      POSTGRES_USER: ${POSTGRES_USER?Variable not set}
      POSTGRES_DB: ${POSTGRES_DB?Variable not set}

  litellm:
    image: docker.litellm.ai/berriai/litellm:v1.94.0
    restart: always
    ports:
      - "${LITELLM_BIND_HOST:-127.0.0.1}:4000:4000"
    command: --config /app/config.yaml
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY?Variable not set}
      NEWAPI_BASE_URL: ${NEWAPI_BASE_URL?Variable not set}
      NEWAPI_API_KEY: ${NEWAPI_API_KEY?Variable not set}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY?Variable not set}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"]
      interval: 5s
      timeout: 5s
      start_period: 90s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: always
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333'
      interval: 5s
      timeout: 5s
      retries: 12

  prestart:
    image: backend
    pull_policy: build
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - DOCLING_BASE_URL=${DOCLING_BASE_URL:-http://docling:5001}
      - POSTGRES_SERVER=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1

  backend:
    image: backend
    pull_policy: build
    restart: always
    ports:
      - "8001:8000"
    depends_on:
      litellm:
        condition: service_healthy
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - FRONTEND_URL=http://frontend:3000
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY?Variable not set}
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - DOCLING_BASE_URL=${DOCLING_BASE_URL:-http://docling:5001}
      - POSTGRES_SERVER=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - QDRANT_URL=http://qdrant:6333
      - LANGFUSE_TRACING_ENVIRONMENT=${ENVIRONMENT}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/utils/health-check/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    build:
      context: .
      dockerfile: backend/Dockerfile

  agent-worker:
    image: backend
    pull_policy: build
    restart: always
    command:
      - celery
      - --app
      - app.modules.agent.task_queue:celery_app
      - worker
      - --loglevel=INFO
    depends_on:
      litellm:
        condition: service_healthy
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - FRONTEND_URL=http://frontend:3000
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY?Variable not set}
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - DOCLING_BASE_URL=${DOCLING_BASE_URL:-http://docling:5001}
      - POSTGRES_SERVER=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - QDRANT_URL=http://qdrant:6333
      - LANGFUSE_TRACING_ENVIRONMENT=${ENVIRONMENT}
    build:
      context: .
      dockerfile: backend/Dockerfile

  knowledge-worker:
    image: backend
    pull_policy: build
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      litellm:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: python -m app.modules.knowledge.worker
    env_file:
      - .env
    environment:
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY?Variable not set}
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - DOCLING_BASE_URL=${DOCLING_BASE_URL:-http://docling:5001}
      - POSTGRES_SERVER=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - QDRANT_URL=http://qdrant:6333

  frontend:
    image: frontend
    pull_policy: build
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    build:
      context: ./frontend
      args:
        BACKEND_API_URL: http://backend:8000
    environment:
      - BACKEND_API_URL=http://backend:8000
    ports:
      - "3001:3000"

volumes:
  app-db-data:
  app-redis-data:
  qdrant-data:
