services:
  db:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
      POSTGRES_USER: ${POSTGRES_USER?Variable not set}
      POSTGRES_DB: ${POSTGRES_DB?Variable not set}

  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.21.0
    restart: always
    environment:
        - DOCLING_SERVE_MAX_FILE_SIZE=104857600
        - DOCLING_SERVE_MAX_NUM_PAGES=1000
        - DOCLING_SERVE_MAX_SYNC_WAIT=300
        - DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT=300
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5001/health')
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  litellm:
    image: docker.litellm.ai/berriai/litellm:v1.94.0
    restart: always
    command: --config /app/config.yaml
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY?Variable not set}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY?Variable not set}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY?Variable not set}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY?Variable not set}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID?Variable not set}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_TOKEN?Variable not set}
      CLOUDFLARE_AI_BASE_URL: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID?Variable not set}/ai/v1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')"]
      interval: 5s
      timeout: 5s
      start_period: 90s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: always
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333'
      interval: 5s
      timeout: 5s
      retries: 12

  prestart:
    image: backend
    pull_policy: build
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db

  backend:
    image: backend
    pull_policy: build
    restart: always
    depends_on:
      litellm:
        condition: service_healthy
      db:
        condition: service_healthy
      docling:
        condition: service_healthy
      data-initializer:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - EMBEDDING_TOKENIZER=/app/models/bge-m3-tokenizer
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY?Variable not set}
      - POSTGRES_SERVER=db
      - QDRANT_URL=http://qdrant:6333
      - LANGFUSE_TRACING_ENVIRONMENT=${ENVIRONMENT}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/utils/health-check/')"]
      interval: 10s
      timeout: 5s
      retries: 5
    build:
      context: .
      dockerfile: backend/Dockerfile

  data-initializer:
    image: backend-data-initializer
    pull_policy: build
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: data-initializer
    depends_on:
      prestart:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db

  knowledge-worker:
    image: backend
    pull_policy: build
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
      docling:
        condition: service_healthy
      litellm:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      data-initializer:
        condition: service_completed_successfully
    command: python -m app.modules.knowledge.worker
    env_file:
      - .env
    environment:
      - EMBEDDING_TOKENIZER=/app/models/bge-m3-tokenizer
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY?Variable not set}
      - POSTGRES_SERVER=db
      - QDRANT_URL=http://qdrant:6333

  frontend:
    image: frontend
    pull_policy: build
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    build:
      context: ./frontend
      args:
        BACKEND_API_URL: http://backend:8000
    environment:
      - BACKEND_API_URL=http://backend:8000
    ports:
      - "3001:3000"

volumes:
  app-db-data:
  qdrant-data:
