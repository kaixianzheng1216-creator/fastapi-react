exclude: ^(\.agents/|backend/app/modules/agent/skills/)

repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        files: ^backend/(app|scripts)/
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        files: ^backend/(app|scripts)/
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy app scripts
        language: system
        files: ^backend/(app|scripts)/.*\.py$
        pass_filenames: false
