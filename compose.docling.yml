services:
  docling:
    image: ghcr.dockerproxy.net/docling-project/docling-serve-cpu:v1.30.0
    restart: always
    mem_limit: 8g
    ports:
      - "${DOCLING_BIND_HOST:-127.0.0.1}:${DOCLING_PORT:-5001}:5001"
    environment:
      DOCLING_SERVE_MAX_FILE_SIZE: "104857600"
      DOCLING_SERVE_MAX_NUM_PAGES: "1000"
      DOCLING_SERVE_MAX_SYNC_WAIT: "840"
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: "840"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "true"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "${DOCLING_SERVE_ENG_LOC_NUM_WORKERS:?Variable not set}"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "true"
      DOCLING_SERVE_CUSTOM_PICTURE_DESCRIPTION_PRESETS: |-
        {
          "deepseek-flash": {
            "engine_options": {
              "engine_type": "api",
              "url": "${DOCLING_PICTURE_DESCRIPTION_URL:?Variable not set}",
              "concurrency": 3,
              "headers": {
                "Authorization": "Bearer ${NEWAPI_API_KEY?Variable not set}"
              }
            },
            "model_spec": {
              "name": "DeepSeek Flash",
              "default_repo_id": "deepseek-flash",
              "prompt": "${IMAGE_DESCRIPTION_PROMPT:?Variable not set}",
              "response_format": "plaintext"
            },
            "prompt": "${IMAGE_DESCRIPTION_PROMPT:?Variable not set}",
            "generation_config": {
              "max_new_tokens": 1000
            }
          }
        }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5001/ready')
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

